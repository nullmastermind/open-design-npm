name: Sync fork

on:
  schedule:
    - cron: "0 3 * * *"
  workflow_dispatch:

permissions:
  contents: write
  # Needed to dispatch publish-npm.yml at the end of a successful sync.
  actions: write

jobs:
  sync:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4
        with:
          fetch-depth: 0
          token: ${{ secrets.GITHUB_TOKEN }}

      - name: Configure git user
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"

      # Needed by the "Validate merge result" step below, which parse-checks
      # the merge before it is allowed to reach main.
      - uses: actions/setup-node@v4
        with:
          node-version: '24'

      - uses: pnpm/action-setup@v4
        with:
          version: '10.33.2'

      - name: Add upstream and fetch
        run: |
          git remote add upstream https://github.com/nexu-io/open-design.git
          git fetch upstream main

      - name: Check for new commits
        id: check
        run: |
          if git merge-base --is-ancestor upstream/main origin/main; then
            echo "No new commits from upstream."
            echo "has_updates=false" >> "$GITHUB_OUTPUT"
          else
            echo "New commits found from upstream."
            echo "has_updates=true" >> "$GITHUB_OUTPUT"
          fi

      - name: Merge upstream/main
        if: steps.check.outputs.has_updates == 'true'
        run: |
          if git merge upstream/main -X ours --no-edit; then
            echo "Merge completed cleanly."
          else
            # Resolve modify/delete conflicts by removing those files (we deleted them intentionally)
            conflicts=$(git diff --name-only --diff-filter=U)
            if [ -z "$conflicts" ]; then
              echo "Merge failed with no resolvable conflicts."
              exit 1
            fi
            echo "Resolving modify/delete conflicts by removing:"
            echo "$conflicts"
            echo "$conflicts" | xargs -r git rm -f
            git commit --no-edit
          fi

      - name: Remove unwanted workflow files
        if: steps.check.outputs.has_updates == 'true'
        run: |
          removed=false
          for f in .github/workflows/*; do
            basename="$(basename "$f")"
            if [ "$basename" != "publish-npm.yml" ] && [ "$basename" != "sync-fork.yml" ]; then
              rm -rf "$f"
              removed=true
            fi
          done
          if [ "$removed" = "true" ]; then
            git add -A
            git commit --amend --no-edit
          fi

      - name: Validate merge result
        # `-X ours` resolves conflicting hunks silently and exits 0, so a merge
        # can splice our deletions into upstream's rewritten code and produce
        # source that no longer parses — with no conflict markers and no error.
        # That is how the 2026-08-10 sync landed three unparseable files on
        # main, which then broke the publish build. Gate the push on it.
        #
        # Deliberately parse-only, not `pnpm typecheck`: this fork removes
        # modules that upstream still references, so its tree is not
        # guaranteed typecheck-clean even for a good merge, and gating on
        # typecheck could block every sync. See the script's header comment.
        if: steps.check.outputs.has_updates == 'true'
        run: |
          set -o pipefail
          pnpm install --frozen-lockfile
          node --experimental-strip-types .github/scripts/check-merge-parse.ts

      - name: Push to origin
        if: steps.check.outputs.has_updates == 'true'
        run: git push origin main

      - name: Trigger npm build and publish
        # publish-npm.yml also listens on `push: branches: [main]`, but a push
        # made with GITHUB_TOKEN never triggers other workflow runs (GitHub's
        # anti-recursion rule), so the sync above would otherwise never lead
        # to a publish. workflow_dispatch is exempt from that rule, so we
        # dispatch it explicitly once the sync has landed on main.
        if: steps.check.outputs.has_updates == 'true'
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: gh workflow run publish-npm.yml --ref main
