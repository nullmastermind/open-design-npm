name: Sync fork

on:
  schedule:
    - cron: "0 3 * * *"
  workflow_dispatch:

permissions:
  contents: write

jobs:
  sync:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4
        with:
          fetch-depth: 0
          token: ${{ secrets.GITHUB_TOKEN }}

      - name: Configure git user
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"

      - name: Add upstream and fetch
        run: |
          git remote add upstream https://github.com/nexu-io/open-design.git
          git fetch upstream main

      - name: Check for new commits
        id: check
        run: |
          if git merge-base --is-ancestor upstream/main origin/main; then
            echo "No new commits from upstream."
            echo "has_updates=false" >> "$GITHUB_OUTPUT"
          else
            echo "New commits found from upstream."
            echo "has_updates=true" >> "$GITHUB_OUTPUT"
          fi

      - name: Merge upstream/main
        if: steps.check.outputs.has_updates == 'true'
        run: |
          git merge upstream/main -X ours --no-edit || {
            echo "Merge failed completely."
            exit 1
          }

      - name: Remove unwanted workflow files
        if: steps.check.outputs.has_updates == 'true'
        run: |
          removed=false
          for f in .github/workflows/*; do
            basename="$(basename "$f")"
            if [ "$basename" != "publish-npm.yml" ] && [ "$basename" != "sync-fork.yml" ]; then
              rm -f "$f"
              removed=true
            fi
          done
          if [ "$removed" = "true" ]; then
            git add -A
            git commit --amend --no-edit
          fi

      - name: Push to origin
        if: steps.check.outputs.has_updates == 'true'
        run: git push origin main
