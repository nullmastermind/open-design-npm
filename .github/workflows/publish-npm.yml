name: Publish npm package

on:
  push:
    branches:
      - main
  workflow_dispatch:

jobs:
  publish:
    runs-on: ubuntu-latest
    # Skip if this is a version-bump commit from this workflow
    if: "!contains(github.event.head_commit.message, '[skip ci]')"
    permissions:
      contents: write
      id-token: write
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
          token: ${{ secrets.GITHUB_TOKEN }}

      - uses: actions/setup-node@v4
        with:
          node-version: '20'
          registry-url: 'https://registry.npmjs.org'

      - uses: pnpm/action-setup@v4
        with:
          version: '10.33.2'

      - name: Install dependencies
        run: pnpm install --frozen-lockfile

      - name: Bump patch version
        id: version
        working-directory: npm-package
        run: |
          npm version patch --no-git-tag-version
          echo "version=$(node -p "require('./package.json').version")" >> "$GITHUB_OUTPUT"

      - name: Build npm package
        run: node npm-package/scripts/build.mjs

      - name: Commit version bump and push tag
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"
          git add npm-package/package.json
          git commit -m "chore(npm-package): bump to v${{ steps.version.outputs.version }} [skip ci]"
          git tag "npm-v${{ steps.version.outputs.version }}"
          git pull --rebase origin main
          git push origin main --follow-tags

      - name: Publish to npm
        working-directory: npm-package
        run: npm publish --provenance --access public
        env:
          NODE_AUTH_TOKEN: ${{ secrets.NPM_TOKEN }}
